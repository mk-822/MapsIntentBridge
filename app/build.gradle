plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'jp.mapsintentbridge'
    compileSdk 35

    defaultConfig {
        applicationId 'jp.mapsintentbridge'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '1.0.0-alpha.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
